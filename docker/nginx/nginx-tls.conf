# Nautilus Agent Platform TLS 反向代理（--profile tls 启用）
# 证书：docker/nginx/certs/server.crt|server.key（自签生成命令见 docs/DOCKER.md）
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全响应头（医疗行业基线）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://agent-service:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 平台据此取真实 client_ip
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;   # 长任务（同步 /chat）兜底
    }
}
