<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nautilus Agent Platform · 控制台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #0f1420; color: #e6eaf2; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #1b2a4a 0%, #12305c 100%);
    padding: 14px 24px; display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid #2a3a5c; flex-shrink: 0;
  }
  header .logo {
    width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; background: #0ea5e9; color: #fff;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; color: #8fa3c8; margin-top: 2px; }
  header .user-box { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8fa3c8; }
  .user-chip {
    padding: 5px 12px; border-radius: 14px; background: #0c1526; border: 1px solid #263350;
    font-size: 12px; color: #9fb6dd;
  }
  .user-chip b { color: #7dd3fc; }
  header .bpm-btn {
    background: #713f12; color: #fde68a; border: 1px solid #a16207; border-radius: 8px;
    padding: 7px 12px; font-size: 12px; cursor: pointer; transition: .15s; white-space: nowrap;
  }
  header .bpm-btn:hover { border-color: #fbbf24; }
  header .bpm-btn.approved { background: #14532d; color: #86efac; border-color: #22c55e; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; gap: 10px; max-width: 860px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center; font-size: 15px; }
  .msg.ai .avatar { background: #0ea5e9; }
  .msg.user .avatar { background: #475569; }
  .bubble { border-radius: 12px; padding: 12px 16px; line-height: 1.7; font-size: 14px;
    white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #1e3358; border-top-right-radius: 4px; }
  .msg.ai .bubble { background: #161f33; border: 1px solid #263350; border-top-left-radius: 4px; }
  .meta { font-size: 11px; color: #6b7f9e; margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
  .meta .tag { padding: 1px 8px; border-radius: 10px; background: #0c1526; border: 1px solid #263350; }
  .steps { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 12px; font-family: Consolas, monospace;
    background: #0c1526; border: 1px solid #22304e; border-radius: 8px; padding: 7px 12px; }
  .step .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .dot.err { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
  .dot.warn { background: #f59e0b; }
  .step b { color: #9fb6dd; }
  footer { padding: 14px 24px 20px; border-top: 1px solid #22304e; background: #0c1220; flex-shrink: 0; }
  .quick { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .quick button { background: #16213a; color: #93a8cc; border: 1px solid #263350; border-radius: 16px;
    padding: 5px 14px; font-size: 12px; cursor: pointer; transition: .15s; }
  .quick button:hover { border-color: #0ea5e9; color: #e6eaf2; }
  .input-row { display: flex; gap: 10px; }
  #input { flex: 1; background: #0c1526; border: 1px solid #2a3a5c; border-radius: 10px; color: #e6eaf2;
    padding: 12px 16px; font-size: 14px; outline: none; resize: none; font-family: inherit; }
  #input:focus { border-color: #0ea5e9; }
  #send { background: #0ea5e9; color: #fff; border: none; border-radius: 10px; padding: 0 26px;
    font-size: 14px; cursor: pointer; font-weight: 600; }
  #send:disabled { background: #164e63; cursor: not-allowed; }
  .empty { margin: auto; text-align: center; color: #55688c; font-size: 13px; line-height: 2.2; }
  .empty .big { font-size: 40px; }

  /* ===== P2 登录层 ===== */
  #loginOverlay {
    position: fixed; inset: 0; background: rgba(8,12,22,.92); z-index: 50;
    display: flex; align-items: center; justify-content: center;
  }
  #loginOverlay.hidden { display: none; }
  .login-card { width: 340px; background: #101a2e; border: 1px solid #2a3a5c; border-radius: 14px; padding: 28px; }
  .login-card h2 { font-size: 17px; text-align: center; margin-bottom: 4px; }
  .login-card .hint { font-size: 11px; color: #6b7f9e; text-align: center; margin-bottom: 18px; }
  .login-card input { width: 100%; background: #0c1526; border: 1px solid #2a3a5c; color: #e6eaf2;
    border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; margin-bottom: 12px; }
  .login-card input:focus { border-color: #0ea5e9; }
  .login-card button { width: 100%; background: #0ea5e9; color: #fff; border: none; border-radius: 8px;
    padding: 10px; font-size: 14px; cursor: pointer; font-weight: 600; }
  #loginErr { color: #f87171; font-size: 12px; min-height: 16px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="logo">🧠</div>
  <div>
    <h1>Nautilus Agent Platform 控制台</h1>
    <div class="sub">JWT 认证 · 角色权限 · 异步任务 · LangGraph 多智能体 · MCP 网关 · BPM 审批</div>
  </div>
  <div class="user-box">
    <button class="bpm-btn" id="bpmBtn" title="模拟审批人在 Conductor 完成审批（Task API 语义）"
      onclick="approveDemo()">🏛 审批人：待审批</button>
    <span class="user-chip" id="userChip">未登录</span>
  </div>
</header>

<div id="chat">
  <div class="empty" id="empty">
    <div class="big">🐚</div>
    试试：「查一下阿莫西林胶囊库存，缺货的话发起采购审批并自动下单」<br>
    审批通过后：「审批已通过，执行订单 workflow_id=xxx」
  </div>
</div>

<footer>
  <div class="quick">
    <button data-t="查一下阿莫西林胶囊库存，缺货的话发起采购审批并自动下单">📦 查库存+发起采购</button>
    <button data-t="查询患者张三的档案">🩺 查患者档案</button>
    <button data-t="审批已通过，执行订单 workflow_id=wf-demo-001">✅ 执行已批准订单</button>
  </div>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="输入业务指令，Enter 发送（Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </div>
</footer>

<!-- P2 登录层 -->
<div id="loginOverlay" class="hidden">
  <div class="login-card">
    <h2>🐚 Nautilus Agent Platform</h2>
    <div class="hint">种子账号：admin/Admin@123 · purchaser/Purchase@123 · viewer/Viewer@123</div>
    <input id="loginUser" placeholder="用户名" value="admin">
    <input id="loginPass" placeholder="口令" type="password" value="Admin@123">
    <button onclick="doLogin()">登 录</button>
    <div id="loginErr"></div>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let TOKEN = localStorage.getItem('nautilus_token') || '';
let CURRENT_USER = null;

/* ==================== P2 认证 ==================== */
async function doLogin() {
  const err = document.getElementById('loginErr');
  err.textContent = '';
  try {
    const resp = await fetch('/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('loginUser').value.trim(),
        password: document.getElementById('loginPass').value
      })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '登录失败');
    TOKEN = data.token; CURRENT_USER = data;
    localStorage.setItem('nautilus_token', TOKEN);
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('userChip').innerHTML =
      `<b>${esc(data.username)}</b> · ${data.role}`;
  } catch (e) { err.textContent = e.message; }
}

async function ensureLogin() {
  if (TOKEN) {
    try {
      const resp = await fetch('/auth/me', { headers: authHeaders() });
      if (resp.ok) {
        CURRENT_USER = await resp.json();
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('userChip').innerHTML =
          `<b>${esc(CURRENT_USER.username)}</b> · ${CURRENT_USER.role}`;
        return;
      }
    } catch (e) { /* fallthrough */ }
  }
  document.getElementById('loginOverlay').classList.remove('hidden');
}

const authHeaders = () => ({
  'Content-Type': 'application/json',
  ...(TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {})
});

/* ==================== 对话渲染 ==================== */
function addMsg(role, html) {
  document.getElementById('empty')?.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="avatar">${role === 'ai' ? '🧠' : '👤'}</div>
                   <div style="max-width:78%">${html}</div>`;
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  return div;
}

function renderSteps(results) {
  if (!results?.length) return '';
  const AGENT = { query_agent: '查询Agent', approval_agent: '审批Agent', operator_agent: '操作Agent' };
  return '<div class="steps">' + results.map(r => {
    const ok = r.ok;
    const dot = ok ? 'ok' : (String(r.error).includes('BPM_PENDING') ? 'warn' : 'err');
    const brief = ok
      ? JSON.stringify(r.data).slice(0, 90)
      : esc(String(r.error).replace(/\n/g, ' ').slice(0, 110));
    return `<div class="step"><span class="dot ${dot}"></span>
      <b>${AGENT[r.agent] || r.agent}</b>
      <span style="color:#7d92b5">${esc(r.tool)}</span>
      <span style="color:${ok ? '#6b7f9e' : '#f87171'};flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${brief}</span>
    </div>`;
  }).join('') + '</div>';
}

function syncWorkflowQuickBtn(results) {
  const btn = document.querySelector('.quick button[data-t*="workflow_id="]');
  if (!btn) return;
  for (const r of results || []) {
    const wid = r?.data?.workflow_id;
    if (r.ok && wid) {
      btn.dataset.t = `审批已通过，执行订单 workflow_id=${wid}`;
      btn.textContent = `✅ 执行已批准订单 (${wid.slice(0,8)}…)`;
      return;
    }
  }
}

/* ==================== P2 异步提交 + 轮询 ==================== */
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function sendMsg() {
  const text = input.value.trim();
  if (!text || send.disabled) return;
  if (!TOKEN) { document.getElementById('loginOverlay').classList.remove('hidden'); return; }
  input.value = '';
  addMsg('user', `<div class="bubble">${esc(text)}</div>`);

  send.disabled = true; input.disabled = true;
  const aiDiv = addMsg('ai', '<div class="bubble">⏳ 任务已提交，多智能体协作处理中…</div>');
  const bubble = aiDiv.querySelector('.bubble');

  try {
    const submit = await fetch('/chat/async', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ message: text })
    });
    if (submit.status === 401) { showLogin(bubble); return; }
    const { task_id } = await submit.json();

    for (let i = 0; i < 120; i++) {          // 最长轮询 3 分钟
      await sleep(1500);
      const poll = await fetch(`/chat/tasks/${task_id}`, { headers: authHeaders() });
      const task = await poll.json();
      if (['OK', 'PARTIAL', 'FAILED'].includes(task.status)) {
        bubble.innerHTML = esc(task.answer || '任务完成') + renderSteps(task.results) +
          `<div class="meta">
            <span class="tag">trace: ${task.trace_id || '-'}</span>
            <span class="tag">状态: ${task.status}</span>
            <span class="tag">task: ${task_id}</span>
            <span class="tag">${new Date().toLocaleTimeString()}</span>
          </div>`;
        syncWorkflowQuickBtn(task.results);
        return;
      }
      bubble.textContent = `⏳ ${task.status} · 多智能体协作处理中…`;
    }
    bubble.innerHTML = '<span style="color:#f59e0b">任务超时，请稍后在会话历史中查看结果</span>';
  } catch (e) {
    bubble.innerHTML = `<span style="color:#f87171">请求失败：${esc(e.message)}</span>`;
  } finally {
    send.disabled = false; input.disabled = false; input.focus(); chat.scrollTop = chat.scrollHeight;
  }
}

function showLogin(bubble) {
  bubble.innerHTML = '<span style="color:#f59e0b">登录已过期，请重新登录</span>';
  document.getElementById('loginOverlay').classList.remove('hidden');
}

/* ==================== 审批人按钮（Task API 语义） ==================== */
async function approveDemo() {
  const btn = document.getElementById('bpmBtn');
  try {
    const resp = await fetch('http://localhost:9000/demo/approve', { method: 'POST' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    btn.classList.add('approved');
    btn.textContent = `🏛 审批人：已通过 ✓ (${data.approved?.length || 0})`;
  } catch (e) {
    btn.textContent = '🏛 Mock 未启动';
    setTimeout(() => btn.textContent = '🏛 审批人：待审批', 2500);
  }
}

send.onclick = sendMsg;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
document.getElementById('loginPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.querySelectorAll('.quick button').forEach(b =>
  b.onclick = () => { input.value = b.dataset.t; sendMsg(); });

ensureLogin();
</script>
</body>
</html>
